<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>영화 리뷰 감정 분석</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }
        h1 { text-align: center; color: #333; }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #4338ca; }

        #result {
            margin-top: 24px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            display: none;
        }
        .positive { border-left: 6px solid #22c55e; }
        .negative { border-left: 6px solid #ef4444; }
    </style>
</head>
<body>
<h1>영화 리뷰 감정 분석</h1>
<p style="text-align:center; color:#666;">영어로 리뷰를 입력하면 긍정/부정을 판단해줘요</p>

<textarea id="reviewText" placeholder="예: This movie was absolutely amazing! The acting was great."></textarea>
<button onclick="analyze()">분석하기</button>

<div id="result">
    <div id="label"></div>
    <div id="confidence" style="font-size:14px; color:#666; margin-top:8px;"></div>
    <div id="score" style="font-size:13px; color:#aaa; margin-top:4px;"></div>
</div>

<script>
    async function analyze() {
        const text = document.getElementById('reviewText').value;
        const resultDiv = document.getElementById('result');

        // Flask API 호출
        const response = await fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
        });

        const data = await response.json();

        // 결과 표시
        document.getElementById('label').textContent = data.label;
        document.getElementById('confidence').textContent = `확신도: ${data.confidence}`;
        document.getElementById('score').textContent = `원시 점수: ${data.score.toFixed(4)}`;

        // 색상 변경
        resultDiv.className = data.score >= 0.5 ? 'positive' : 'negative';
        resultDiv.style.display = 'block';
    }
</script>
</body>
</html>
