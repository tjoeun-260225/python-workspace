<!DOCTYPE html>
<html>
<head>
    <title>손글씨 숫자 인식</title>
    <style>
        body { text-align: center; font-family: Arial; padding: 50px; }
        canvas { border: 3px solid black; cursor: crosshair; }
        button { margin: 10px; padding: 10px 20px; font-size: 16px; }
        #result { font-size: 48px; font-weight: bold; color: blue; margin: 20px; }
    </style>
</head>
<body>
<h1>숫자를 그려보세요 (0~9)</h1>
<canvas id="canvas" width="280" height="280"></canvas>
<br>
<button onclick="predict()">예측하기</button>
<button onclick="clear()">지우기</button>
<div id="result">?</div>
<div id="confidence"></div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, 280, 280);
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 20;
    ctx.lineCap = 'round';

    let drawing = false;
    canvas.onmousedown = (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
    canvas.onmousemove = (e) => { if (drawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); }};
    canvas.onmouseup = () => drawing = false;

    function clear() {
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, 280, 280);
        document.getElementById('result').innerText = '?';
        document.getElementById('confidence').innerText = '';
    }

    function predict() {
        const imageData = canvas.toDataURL('image/png');
        fetch('/predict', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({image: imageData})
        })
            .then(res => res.json())
            .then(data => {
                document.getElementById('result').innerText = data.result;
                document.getElementById('confidence').innerText = '확률: ' + data.confidence;
            });
    }
</script>
</body>
</html>
